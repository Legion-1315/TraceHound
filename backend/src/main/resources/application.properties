spring.application.name=triage-copilot-backend
# Cloud Run (and most PaaS) inject the port to listen on; 8080 locally.
server.port=${PORT:8080}

# Secrets live in a git-ignored .env file (KEY=value lines) at the repo root, or in real
# environment variables. Both locations are optional; environment variables win.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Which estate the agent investigates:
#   simulated (default) - in-process simulated telemetry, the original hackathon demo
#   live                - the real estate services in estate/ (see README: "Live estate")
triage.estate=${TRIAGE_ESTATE:simulated}

# Simulated estate only: scripted | llm. The live estate always uses the LLM agent.
triage.investigator-mode=${TRIAGE_MODE:scripted}

triage.anthropic.api-key=${ANTHROPIC_API_KEY:}
triage.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
triage.anthropic.max-tokens=4096

# Spending guard-rails for LLM investigations (all in-memory, reset 00:00 UTC).
triage.llm.max-investigations-per-client-per-hour=${TRIAGE_MAX_PER_CLIENT_PER_HOUR:5}
triage.llm.max-investigations-per-day=${TRIAGE_MAX_PER_DAY:40}
triage.llm.max-daily-cost-usd=${TRIAGE_MAX_DAILY_COST_USD:5.0}
triage.llm.max-concurrent=${TRIAGE_MAX_CONCURRENT:2}
# Prices used for the cost estimate, USD per million tokens. Check the current pricing page
# for your model and update these if they differ.
triage.llm.price-input-per-mtok=${TRIAGE_PRICE_INPUT_PER_MTOK:2.0}
triage.llm.price-output-per-mtok=${TRIAGE_PRICE_OUTPUT_PER_MTOK:10.0}
# Only enable behind a reverse proxy you control; otherwise clients could spoof their identity.
triage.trust-forwarded-for=${TRIAGE_TRUST_FORWARDED_FOR:false}

# Live estate service locations (docker-compose overrides these with container hostnames).
triage.estate.urls.trade-capture=${TRADE_CAPTURE_URL:http://localhost:8101}
triage.estate.urls.ref-data-service=${REF_DATA_SERVICE_URL:http://localhost:8102}
triage.estate.urls.enrichment-service=${ENRICHMENT_SERVICE_URL:http://localhost:8103}
triage.estate.urls.submission-builder=${SUBMISSION_BUILDER_URL:http://localhost:8104}
triage.estate.urls.regulatory-gateway=${REGULATORY_GATEWAY_URL:http://localhost:8105}
triage.estate.urls.trade-confirmations=${TRADE_CONFIRMATIONS_URL:http://localhost:8106}

triage.memory-file=${TRIAGE_MEMORY_FILE:./data/incident-memory.json}
# pacing for the scripted investigator (ms between steps)
triage.step-delay-min-ms=800
triage.step-delay-max-ms=1500
triage.history-file=${TRIAGE_HISTORY_FILE:./data/incident-history.json}
