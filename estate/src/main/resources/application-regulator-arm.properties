estate.role=regulator-arm
server.port=${PORT:8443}
estate.release=1.0.0
estate.change-noise.enabled=false
# The regulator only speaks mutual TLS: no valid client certificate, no handshake.
server.ssl.enabled=true
server.ssl.key-store=classpath:certs/regulator.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=regulator
server.ssl.client-auth=need
server.ssl.trust-store=classpath:certs/truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12
