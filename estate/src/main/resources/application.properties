spring.application.name=estate
spring.main.banner-mode=off
spring.task.scheduling.pool.size=4
spring.jackson.serialization.write-dates-as-timestamps=false

# Which service this process is. Set by the profile (application-<service>.properties).
estate.role=unset
estate.release=1.0.0
estate.baseline-per-min=120
estate.trade-interval-ms=500
estate.confirmation-interval-ms=1000

# Where the other services live. Defaults suit running everything on one machine;
# docker-compose overrides them with container hostnames.
estate.urls.trade-capture=${TRADE_CAPTURE_URL:http://localhost:8101}
estate.urls.ref-data-service=${REF_DATA_SERVICE_URL:http://localhost:8102}
estate.urls.enrichment-service=${ENRICHMENT_SERVICE_URL:http://localhost:8103}
estate.urls.submission-builder=${SUBMISSION_BUILDER_URL:http://localhost:8104}
estate.urls.regulatory-gateway=${REGULATORY_GATEWAY_URL:http://localhost:8105}
estate.urls.trade-confirmations=${TRADE_CONFIRMATIONS_URL:http://localhost:8106}
estate.urls.regulator-arm=${REGULATOR_ARM_URL:https://localhost:8443}
