estate.role=ref-data-service
server.port=${PORT:8102}
estate.release=2.4.0
# enrichment: 2 lookups per trade (240/min) + confirmations: 2 per confirmation (120/min)
estate.baseline-per-min=360
# currency lookups can arrive in bursts; keep enough request threads for the slow path
server.tomcat.threads.max=64
