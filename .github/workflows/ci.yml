name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write   # lets the failure step leave a commit comment with the relevant log tail

jobs:
  build:
    name: Build & test (estate, backend, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Estate services — test + jar
        working-directory: estate
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon 2>&1 | tee ../ci-estate.log

      - name: Triage app — test + jar (builds the React UI too)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon 2>&1 | tee ../ci-backend.log

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint 2>&1 | tee ../ci-frontend-lint.log

      - name: Upload jars for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            estate/build/libs/*.jar
            backend/build/libs/*.jar
          retention-days: 3

      - name: Post failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('./.github/scripts/failure-report.js');
            await report({ github, context, job: 'build' });

  smoke:
    name: Live estate smoke test (real services, real faults, no LLM)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jars

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start the estate and the triage app, inject faults, check symptoms
        run: |
          if [ ! -f scripts/smoke-test.sh ]; then echo "no smoke test yet"; exit 0; fi
          bash scripts/smoke-test.sh 2>&1 | tee ci-smoke.log

      - name: Collect service logs
        if: always()
        run: tail -n 40 .run/logs/*.log > ci-service-logs.log 2>/dev/null || true

      - name: Post failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('./.github/scripts/failure-report.js');
            await report({ github, context, job: 'smoke' });

  docker:
    name: Docker images build (compose)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every image the live demo uses
        run: |
          cp .env.example .env
          docker compose build
          DOMAIN=ci.sslip.io docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
